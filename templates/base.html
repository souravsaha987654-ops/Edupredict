<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EduPredict AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<header class="nav">
  <a class="logo" href="{{ url_for('home' if profile else 'welcome') }}"><i>🎓</i>EduPredict AI</a>
  {% if signed %}<nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('how') }}">How it works</a><a href="{{ url_for('logout') }}">Sign out</a></nav>{% endif %}
</header>
{% block content %}{% endblock %}
<footer>EduPredict AI · AI-Driven Student Performance Prediction &amp; Academic Analytics</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
